[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "noshow-iq"
version = "0.1.0"
description = "Prediction API for patient appointment no-shows"
authors = [{ name = "Qurat-Ul-Ain", email = "qurat.alvi11@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "scikit-learn==1.5.2",
    "imbalanced-learn==0.12.3",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "joblib==1.4.2",
    "pymongo==4.8.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "httpx==0.27.2", "flake8==7.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["noshow_iq*"]